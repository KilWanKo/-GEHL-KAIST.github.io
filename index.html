<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GEHL · Geotechnical Earthquake and GeoHazards Lab, KAIST</title>
<meta name="description" content="Geotechnical Earthquake and GeoHazards Lab (GEHL), Department of Civil and Environmental Engineering, KAIST. Research, people, publications, teaching, and news.">
<link rel="icon" href="img/favicon.png" type="image/png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one 1120px column under a sticky bar; Arial throughout (display = bold Arial, labels = small-caps-style tracked Arial); cards for Research and People, dividers elsewhere; the seismogram in the hero is the only flourish. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:#121B2B; --muted:#1C2430; --line:#DDDDDD; --line-strong:#BFBFBF;
  --heading:#002060; --brand:#0D4A9A; --brand-ink:#0A3470; --soft:#E6EEF9; --accent:#C8322B; --trace:#1D3F72; --grid:#E3E8F0;
  --display:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --body:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --mono:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --radius:4px; --shadow:0 10px 30px rgba(10,30,60,.14);
  --ill-ink:#1A2B45; --ill-line:#8794A8; --ill-soil:#E9E1CF; --ill-soil2:#D9CDB0; --ill-rock:#C7CDD6; --ill-water:#D6E6F7; --ill-accent:#C8322B;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em;color:var(--heading)}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px}
.brand{display:flex;align-items:center;flex:0 0 auto;min-width:0}
.brand:hover{text-decoration:none}
.brand .logo{display:block;height:46px;width:auto;max-width:min(320px,62vw);object-fit:contain;border-radius:6px}
nav.main{margin-left:auto;display:flex;gap:4px}
nav.main a{display:block;padding:8px 10px;border-radius:var(--radius);color:var(--fg);font-size:14.5px;font-weight:500}
nav.main a:hover{background:var(--soft);text-decoration:none}
nav.main a[aria-current="page"]{color:var(--brand);box-shadow:inset 0 -2px 0 var(--brand);border-radius:0}
.menu-btn{display:none;margin-left:auto;padding:8px;border:1px solid var(--line);border-radius:var(--radius)}
.menu-btn svg{display:block}
@media (max-width:820px){
  .brand .logo{height:42px;max-width:min(320px,70vw)}
  .menu-btn{display:block}
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;padding:8px max(16px,env(safe-area-inset-left,0px)) 12px;gap:0;box-shadow:var(--shadow)}
  nav.main.open{display:flex}
  nav.main a{padding:11px 8px;border-bottom:1px solid var(--line)}
  nav.main a[aria-current="page"]{box-shadow:none;background:var(--soft)}
}

/* Sections */
main{display:block}
.pband + .wrap{padding-top:32px}
.section{padding-block:56px}
.section + .section{border-top:1px solid var(--line)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.section-head h2{font-size:28px}
.section-head .more{font-size:14px;white-space:nowrap}
.lede{font-size:18px;line-height:1.5;max-width:64ch;color:var(--fg)}
.lede.full{max-width:none}
.prose{max-width:66ch}
.prose p + p{margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--brand);border-radius:var(--radius);color:var(--brand);font-weight:500;font-size:14.5px;line-height:1.2;background:var(--surface)}
.btn:hover{background:var(--soft);text-decoration:none}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.chip{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line-strong);border-radius:999px;color:var(--muted);white-space:nowrap}
.chip.kind-award{border-color:var(--accent);color:var(--accent)}
.chip.kind-publication,.chip.kind-talk{border-color:var(--brand);color:var(--brand)}

/* Page band: every page opens with its title, sized like the lab name, over a faint banner image */
.pband{position:relative;background:var(--surface);border-bottom:1px solid var(--line);overflow:hidden}
.pband::before{content:"";position:absolute;inset:0;background-image:var(--banner);background-size:cover;background-position:center;opacity:.16;pointer-events:none}
.pband .wrap{position:relative;padding-block:56px 40px}
.pband.has-img .wrap{padding-block:72px 52px}
.pband .page-title{font-size:clamp(26px,7vw,40px);font-weight:700;letter-spacing:-.012em;line-height:1.1;margin:0;text-align:center;white-space:normal;color:var(--heading)}
:root.title-fit .pband .page-title{font-size:var(--title-size);white-space:nowrap}
.pband .row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:12px}
.pband .tag{font-family:var(--display);font-weight:400;font-size:18px;color:var(--brand);letter-spacing:.01em}
.pband .founded{font-size:13px;color:var(--fg);letter-spacing:.02em}
.hero{padding-block:30px 8px}
.hero .intro{margin-top:0;max-width:none;font-size:17px;line-height:1.6;color:var(--fg)}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}

/* Group photo (home) and blossom gallery */
.gp{margin-top:24px;border-top:1px solid var(--line)}
.gp-card{overflow:hidden}
.gp-card .ph{position:relative;aspect-ratio:16/7;max-width:100%;background:var(--soft);display:grid;place-items:center}
.gp-card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gp-card .ph .empty-ph{text-align:center;color:var(--muted);padding:24px;font-size:15px;max-width:40ch}
.gp-card .ph .empty-ph b{display:block;font-family:var(--display);font-weight:700;font-size:20px;color:var(--fg);margin-bottom:6px}
.gp-card .cap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 22px}
.gp-card .cap .t{font-size:15px}
.gp-card .cap .t b{font-family:var(--display);font-weight:700;font-size:17px;display:block;margin-bottom:2px;color:var(--heading)}
.blossoms{display:grid;gap:28px}
.blossom{overflow:hidden}
.blossom .ph{aspect-ratio:16/8;max-width:100%;background:var(--soft);position:relative;display:grid;place-items:center}
.blossom .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.blossom .ph .empty-ph{color:var(--muted);font-size:14.5px;text-align:center;padding:20px}
.blossom .cap{padding:14px 22px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.blossom .cap .y{font-family:var(--display);font-weight:700;font-size:22px;color:var(--heading)}
.blossom .cap .t{color:var(--muted);font-size:14.5px}
@media (max-width:600px){ .gp-card .ph{aspect-ratio:4/3} .blossom .ph{aspect-ratio:4/3} }

/* Pillars (conceptual, picture-first) */
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.pillar{display:grid;gap:8px;color:inherit;min-width:0;align-content:start}
.pillar:hover{text-decoration:none}
.pillar .ill{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;aspect-ratio:8/5;max-width:100%}
.pillar .ill svg{display:block;width:100%;height:100%}
.pillar:hover .ill{border-color:var(--brand)}
.pillar h3{font-size:16.5px;margin-top:4px}
.pillar:hover h3{color:var(--brand)}
.pillar p{font-size:13.5px;color:var(--fg);line-height:1.45}
@media (max-width:900px){ .pillars{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:480px){ .pillars{grid-template-columns:1fr} }
.methods{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.methods span{padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);font-size:14px;background:var(--surface)}

/* News list */
.news-list{display:grid;gap:0}
.news-item{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding:20px 0;border-top:1px solid var(--line)}
.news-item:last-child{border-bottom:1px solid var(--line)}
.news-item .d{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.news-item .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.news-item h3{font-size:18px}
.news-item .who{font-size:13.5px;color:var(--muted)}
.news-item .b{margin-top:6px;color:var(--fg);max-width:70ch;font-size:15px}
.news-item .imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.news-item .imgs img{width:200px;max-width:100%;height:140px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line)}
@media (max-width:600px){ .news-item{grid-template-columns:1fr;gap:6px} }
.news-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.news-card{padding:20px 22px;display:flex;flex-direction:column;gap:8px;min-width:0;color:inherit}
.news-card:hover{text-decoration:none}
.news-card .d{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.news-card h3{font-size:18px}
.news-card:hover h3{color:var(--brand)}
.news-card p{font-size:14.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.news-card img{width:100%;height:160px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
@media (max-width:820px){ .news-cards{grid-template-columns:1fr} }
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:8px}
.tabs button{padding:10px 12px;font-size:14.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 18px}
.filters button{padding:5px 10px;border:1px solid var(--line-strong);border-radius:999px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters input{padding:7px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;min-width:0;flex:1 1 200px}
.empty{padding:28px 0;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* Cards (Research, People, home news) */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(10,30,60,.04),0 10px 28px rgba(10,30,60,.06)}
.page-sub{color:var(--muted);font-size:16px;max-width:66ch;margin-top:28px;margin-bottom:22px}

/* People (SEED-style grid) */
.pi-block{display:grid;grid-template-columns:280px minmax(0,1fr);gap:36px;align-items:start;padding:28px;margin-bottom:28px}
.pi-block .avatar{width:280px;height:280px;border-radius:28px}
.pi-block h3{font-size:26px}
.pi-block .role{color:var(--muted);margin-top:4px}
.pi-block .bio{margin-top:14px;max-width:66ch;font-size:15.5px}
.pi-block .links{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:14px}
@media (max-width:700px){ .pi-block{grid-template-columns:1fr;padding:20px} .pi-block .avatar{width:220px;height:220px} }
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.pills button{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 12px;border-radius:999px;background:var(--soft);color:var(--fg);font-size:13.5px;font-weight:500}
.pills button .c{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface);color:var(--muted)}
.pills button[aria-pressed="true"]{background:var(--brand);color:#fff}
.pills button[aria-pressed="true"] .c{background:rgba(255,255,255,.22);color:#fff}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:760px){ .people{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:460px){ .people{grid-template-columns:1fr} }
.pcard{display:grid;gap:10px;padding:22px;color:inherit;text-align:left;min-width:0;transition:transform .15s ease,box-shadow .15s ease}
.pcard:hover{text-decoration:none;transform:translateY(-2px)}
.pcard .avatar{width:100%;max-width:260px;aspect-ratio:1/1;height:auto;border-radius:28px;justify-self:center;margin-bottom:6px}
.pcard .nm{font-family:var(--display);font-weight:700;font-size:17px;color:var(--heading)}
.pcard:hover .nm{color:var(--brand)}
.pcard .in{font-size:13.5px;color:var(--muted);line-height:1.4}
.rpill{display:inline-block;justify-self:start;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid;line-height:1.6}
.rpill.g-pi{color:#8A2E1F;border-color:#D9A79A;background:#FBEFEA}
.rpill.g-postdoc{color:#1E6B45;border-color:#9ECBB1;background:#E9F6EE}
.rpill.g-phd{color:#174A95;border-color:#9DB9E3;background:#E8EFFA}
.rpill.g-ms{color:#7A4A05;border-color:#E3C48E;background:#FBF2E1}
.rpill.g-ug{color:#5B3A8A;border-color:#C4B1E1;background:#F1EBF9}
.rpill.g-staff{color:#465261;border-color:#B8C2CF;background:#EEF1F5}
.avatar{display:block;border-radius:var(--radius);object-fit:cover;background:var(--soft);border:1px solid var(--line)}
.group-title{display:flex;align-items:baseline;gap:12px;margin:30px 0 10px}
.group-title h3{font-size:16px;font-family:var(--mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.group-title .count{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.alumni{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 32px}
.alumni li{list-style:none;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.alumni ul{margin:0;padding:0;display:contents}
.alumni .lv{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px}
.alumni .nt{display:block;color:var(--muted);font-size:13px}

/* Person popup */
.modal{position:fixed;inset:0;z-index:45;background:rgba(8,14,24,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal .dlg{position:relative;width:min(900px,100%);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:28px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-height:calc(100vh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.modal .close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-size:16px;line-height:1}
.modal .close:hover{background:var(--soft)}
.modal .avatar{width:220px;height:220px;border-radius:28px}
.modal .side{display:grid;gap:12px;align-content:start}
.modal .side .links{display:grid;gap:4px;font-size:13.5px}
.modal h2{font-size:26px;margin-top:6px}
.modal .role{font-size:15px;color:var(--muted);margin-top:2px}
.modal .em{font-family:var(--mono);font-size:13px;margin-top:6px;color:var(--muted)}
.modal .sec{margin-top:20px}
.modal .sec h4{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.modal .sec h4 .cnt{color:var(--muted);letter-spacing:0}
.modal .sec ul{margin:0;padding-left:18px;font-size:14.5px}
.modal .sec li{margin:3px 0}
.modal .sec p{font-size:14.5px}
.modal .mp{list-style:none;padding:0;display:grid;gap:10px}
.modal .mp li{font-size:14px}
.modal .mp .t{font-weight:500}
.modal .mp .t a{color:var(--fg)}
.modal .mp .t a:hover{color:var(--brand)}
.modal .mp .a{color:var(--muted);font-size:13.5px}
.modal .mp .a .member{color:var(--fg);text-decoration:underline;text-decoration-color:var(--brand);text-underline-offset:3px}
.modal .mp .v{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.modal .empty-note{font-size:13.5px;color:var(--muted)}
@media (max-width:640px){ .modal .dlg{grid-template-columns:1fr;padding:20px;gap:16px} .modal .avatar{width:140px;height:140px} }

/* Publications */
.pub-year{display:grid;grid-template-columns:90px minmax(0,1fr);gap:20px;padding:22px 0;border-top:1px solid var(--line)}
.pub-year .y{font-family:var(--display);font-size:24px;font-weight:700;color:var(--heading);font-variant-numeric:tabular-nums}
.pub-list{display:grid;gap:16px;margin:0;padding:0;list-style:none}
.pub{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;font-size:15px}
.pub .num{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:3px;text-align:right;font-variant-numeric:tabular-nums}
.pub .au{color:var(--muted)}
.pub .au .member{color:var(--fg);text-decoration:underline;text-decoration-color:var(--brand);text-underline-offset:3px;text-decoration-thickness:1.5px}
.pub .ti{font-weight:500;margin-top:2px}
.pub .ti a{color:var(--fg)}
.pub .ti a:hover{color:var(--brand)}
.pub .ve{color:var(--muted);font-size:14.5px;margin-top:2px}
.pub .ve i{font-style:italic}
.pub .nt{display:inline-block;margin-top:5px;font-size:12.5px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px}
.pub .doi{font-family:var(--mono);font-size:12.5px;margin-left:6px}
@media (max-width:600px){ .pub-year{grid-template-columns:1fr;gap:8px} .pub-year .y{font-size:20px} }
.legend{font-size:13px;color:var(--muted);margin-top:14px}
.legend .member{text-decoration:underline;text-decoration-color:var(--brand);text-underline-offset:3px;color:var(--fg)}

/* Research (card per area) */
.rcards{display:grid;gap:24px}
.rcard{padding:32px 36px}
.rcard h3{font-size:26px;margin-top:6px}
.rcard .prose{margin-top:16px;max-width:none}
.rcard .prose p{font-size:15.5px;line-height:1.6}
.rcard .sub{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.rcard .chips{display:flex;flex-wrap:wrap;gap:8px}
.rcard .chips span{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--soft);color:var(--fg)}
.rcard figure{margin:20px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.rcard figure img{display:block;width:100%;max-height:420px;object-fit:contain;background:#fff}
.rcard figcaption{font-size:12.5px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.rcard .sel{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rcard .sel li{font-size:14px;color:var(--muted);padding-left:14px;position:relative}
.rcard .sel li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.rcard .sel li a{color:var(--fg)}
.rcard .sel li i{font-style:italic}
.rcard .sl{margin-top:18px;font-size:14px}
@media (max-width:640px){ .rcard{padding:22px 18px} .rcard h3{font-size:22px} }
.framework{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:10px;margin:22px 0 0}
.framework .step{border:1px solid var(--line-strong);border-radius:10px;padding:14px 16px;background:var(--surface);min-width:0}
.framework .step .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.framework .step .t{font-family:var(--display);font-weight:700;font-size:17px;margin-top:4px;color:var(--heading)}
.framework .step .s{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.framework .arrow{color:var(--muted);font-size:22px;align-self:center}
.framework .loop{grid-column:1 / -1;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.framework .loop::before,.framework .loop::after{content:"";flex:1;border-top:1px dashed var(--line-strong)}
@media (max-width:720px){ .framework{grid-template-columns:1fr} .framework .arrow{transform:rotate(90deg);justify-self:center} }
.interests{columns:2;column-gap:40px;margin:0;padding-left:18px;font-size:15px}
.interests li{break-inside:avoid;margin:4px 0}
@media (max-width:600px){ .interests{columns:1} }
table.projects{width:100%;border-collapse:collapse;font-size:14.5px}
table.projects th{text-align:left;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px 8px 0;border-bottom:1px solid var(--line-strong)}
table.projects td{padding:12px 10px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.projects td.per{font-family:var(--mono);font-size:13px;white-space:nowrap;color:var(--muted)}
.tablewrap{overflow-x:auto}
@media (max-width:700px){ table.projects{min-width:620px} }

.rcard .quote{margin-top:10px;font-size:17px;font-style:italic;color:var(--brand)}
.cycle{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.cstep{border:1px solid var(--line-strong);border-radius:10px;padding:14px 16px;background:var(--surface);min-width:0}
.cstep .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.cstep .t{font-family:var(--display);font-weight:700;font-size:16px;margin-top:4px;color:var(--heading)}
.cstep .s{font-size:13.5px;color:var(--brand);margin-top:2px}
.cstep p{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.45}
@media (max-width:900px){ .cycle{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .cycle{grid-template-columns:1fr} }
/* Teaching */
.courses{display:grid;gap:0}
.course{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding:22px 0;border-top:1px solid var(--line)}
.course .code{font-family:var(--mono);font-size:13.5px;color:var(--brand)}
.course .term{font-size:13px;color:var(--muted);margin-top:4px}
.course h3{font-size:20px}
.course p{margin-top:8px;color:var(--muted);font-size:15px;max-width:70ch}
@media (max-width:600px){ .course{grid-template-columns:1fr;gap:6px} }

/* Join */
.values{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px 36px;margin-top:8px}
.value{border-top:1px solid var(--line);padding-top:14px}
.value h3{font-size:17px}
.value p{margin-top:6px;color:var(--muted);font-size:14.5px}
.apply{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-top:20px}
.apply .box{border:1px solid var(--line-strong);border-radius:var(--radius);padding:18px;background:var(--surface)}
.apply .box h4{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.apply .box .v{margin-top:8px;font-size:15px}
.apply .box code{font-family:var(--mono);font-size:14px;background:var(--soft);padding:2px 6px;border-radius:3px}
.copy-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.copy-row .addr{font-family:var(--mono);font-size:15px;user-select:all}
.dislist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dislist span{font-size:13.5px;padding:5px 10px;border:1px dashed var(--line-strong);border-radius:var(--radius);color:var(--muted)}
.ko{font-size:14px;color:var(--muted);margin-top:16px}

/* Footer */
footer{border-top:1px solid var(--line);margin-top:40px;background:var(--surface)}
footer .wrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px;padding-block:36px;font-size:14px}
footer h4{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
footer .small{color:var(--muted);font-size:13px;margin-top:14px}
footer ul{margin:0;padding:0;list-style:none}
footer li{margin:4px 0}
@media (max-width:720px){ footer .wrap{grid-template-columns:1fr} }

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--radius);font-size:14px;box-shadow:var(--shadow);z-index:40;max-width:min(90vw,480px)}

/* Admin */
.manage-btn{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:500;font-size:14px;box-shadow:var(--shadow)}
.manage-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.manage-btn.dirty .dot{display:block}
.admin{position:fixed;inset:0;z-index:50;background:rgba(8,14,24,.55);display:flex;justify-content:flex-end}
.admin .panel{width:min(760px,100%);height:100%;background:var(--surface);color:var(--fg);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.admin .ph{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px 20px;border-bottom:1px solid var(--line)}
.admin .ph h2{font-size:18px}
.admin .ph .sp{flex:1}
.admin .tabs{padding:0 20px;margin:0}
.admin .body{flex:1;overflow:auto;padding:18px 20px 90px}
.admin .pf{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.admin .panel{position:relative}
.admin .status{font-size:13.5px;color:var(--muted);flex:1;min-width:0}
.admin .status.err{color:var(--accent)}
.form{display:grid;gap:12px;border:1px solid var(--line-strong);border-radius:var(--radius);padding:16px;margin-bottom:22px;background:var(--surface)}
.form h3{font-size:16px}
.form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);color:var(--fg);min-width:0;width:100%}
.form textarea{min-height:72px;resize:vertical}
.form textarea.tall{min-height:320px;font-family:var(--mono);font-size:12.5px}
.form .help{font-size:12.5px;color:var(--muted)}
.form .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form .match{font-size:13px;padding:8px 10px;border-radius:var(--radius);background:var(--soft)}
.form .match b{font-weight:600}
.alist{display:grid;gap:0;margin-bottom:10px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.arow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .s{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .b{display:flex;gap:6px}
.arow .b button{font-size:12.5px;padding:4px 8px;border:1px solid var(--line-strong);border-radius:var(--radius)}
.arow .b button.del{color:var(--accent);border-color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .th{position:relative}
.thumbs img{width:96px;height:72px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:12px;line-height:1}
.inline-confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

 "teachingPhilosophy": "New research and new technology keep expanding what is known, so a teacher has to keep learning and recognize quickly which new developments matter. That takes a firm grip on the fundamentals. The aim in every course is to close the gap between established and new research, to connect fundamental theory with practice, and to help students become self-directed engineers who can solve problems that did not exist when they were students.",
 "culture": {
  "lead": "Research begins where something does not work. We go after unsolved problems and trace them back to fundamentals, with the freedom of structured autonomy: flexible but clear guidelines, self-directed growth, and teamwork.",
  "lookingFor": [
   {
    "title": "Teamwork",
    "text": "We share data, code, failures, and credit. Progress in a centrifuge lab is a team result."
   },
   {
    "title": "A mechanics-oriented mindset",
    "text": "Tools change; equilibrium, compatibility, and constitutive behavior do not. We want people who reason from mechanics first."
   },
   {
    "title": "Logical communication",
    "text": "A clear argument, in a figure or a paragraph, is as much a research skill as a good test."
   },
   {
    "title": "Persistence and resilience",
    "text": "Tests fail, models diverge, and reviewers push back. Keep going, and learn from what broke."
   },
   {
    "title": "Clear storytelling",
    "text": "Research has to be explained to colleagues, practitioners, and the public."
   },
   {
    "title": "Self-motivation",
    "text": "Curiosity and a sense of engineering responsibility carry a project further than any schedule."
   }
  ],
  "discourage": [
   "Competitive over-calculation",
   "Intellectual rigidity",
   "Selective transparency and stagnant sharing",
   "Tool-centric shortcuts",
   "Isolated individualism"
  ],
  "positions": "We welcome undergraduate interns and graduate students (M.S. and Ph.D.) who are interested in geotechnical earthquake engineering and natural hazards. Character and mindset matter as much as academic record: an inquisitive spirit, persistence, respect, humility, and logical thinking. We are always open to discussing methodologies, research ideas, and emerging topics.",

      (p.email ? '<div class="em">' + esc(p.email) + '</div>' : '') +
      (p.bio ? '<div class="sec"><p>' + esc(p.bio) + '</p></div>' : '') +
      list('Research interests', p.interests) + list('Education', p.education) + list('Experience', p.appointments) + list('Awards and honors', p.awards) + list('Professional service', p.service) +
      plist('Journal papers', jp) + plist('Conference proceedings', cp) +
      (!jp.length && !cp.length ? '<div class="sec"><h4>Publications</h4><p class="empty-note">No publications listed yet.</p></div>' : '') +

      '</div></div></div>';
  }
  function openPerson(id) {
    var p = personById(id); if (!p) return;
    var root = document.getElementById('modal-root');
    root.innerHTML = personModal(p);
    document.body.style.overflow = 'hidden';
    var c = root.querySelector('.close'); if (c) c.focus();
    try { if (location.hash !== '#person-' + id) history.replaceState(null, '', '#person-' + id); } catch (e) { }
  }
  function closeModal() {
    var root = document.getElementById('modal-root'); root.innerHTML = ''; document.body.style.overflow = '';
    if (/^#person-/.test(location.hash)) { try { history.replaceState(null, '', '#people'); } catch (e) { } }
  }

  var pubState = { type: 'journal', year: 'all', q: '' };
  function viewPublications() {
    var all = DATA.publications.filter(function (p) { return p.type === pubState.type; });
    var years = {}; all.forEach(function (p) { years[p.year] = 1; });
    var ys = Object.keys(years).sort(function (a, b) { return b - a; });
    var q = pubState.q.trim().toLowerCase();
    var shown = all.filter(function (p) { return (pubState.year === 'all' || String(p.year) === pubState.year) && (!q || (p.title + ' ' + p.authors + ' ' + p.venue + ' ' + (p.note || '')).toLowerCase().indexOf(q) >= 0); });
    shown.sort(function (a, b) { return b.year - a.year; });
    var jn = DATA.publications.filter(function (p) { return p.type === 'journal'; }).length, cn = DATA.publications.length - jn;
    var html = pageBand('publications', 'Publications') + '<div class="wrap">' +
      '<div class="tabs" role="tablist"><button role="tab" data-pt="journal" aria-selected="' + (pubState.type === 'journal') + '">Journal papers (' + jn + ')</button><button role="tab" data-pt="conference" aria-selected="' + (pubState.type === 'conference') + '">Conference proceedings (' + cn + ')</button></div>' +
      '<div class="filters"><button data-py="all" aria-pressed="' + (pubState.year === 'all') + '">All years</button>' + ys.map(function (y) { return '<button data-py="' + y + '" aria-pressed="' + (pubState.year === y) + '">' + y + '</button>'; }).join('') +
      '<input type="search" id="pub-q" placeholder="Search title, author, journal" value="' + attr(pubState.q) + '" aria-label="Search publications"></div>';
    html += shown.length ? pubListByYear(shown, shown.length) : '<div class="empty">No publications match.</div>';
    html += '<p class="legend"><span class="member">Underlined</span> authors are GEHL members. * marks the corresponding author. Numbering counts down from the most recent paper.</p>';
    return html + '</div>';
  }

  function viewTeaching() {
    var T = DATA.teaching || {};
    var html = pageBand('teaching', 'Teaching') + '<div class="wrap">';
    html += '<section class="card rcard"><div class="eyebrow">Teaching philosophy</div><h3>' + esc(T.goal || 'Teaching philosophy') + '</h3>';
    if (T.quote) html += '<p class="quote">“' + esc(T.quote) + '”</p>';
    if (T.lead) html += '<div class="prose"><p>' + esc(T.lead) + '</p></div>';
    if (T.cycle && T.cycle.length) html += '<div class="cycle">' + T.cycle.map(function (c, i) { return '<div class="cstep"><div class="k">' + esc(c.k) + '</div><div class="t">' + esc(c.t) + '</div><div class="s">→ ' + esc(c.s) + '</div><p>' + esc(c.d) + '</p></div>'; }).join('') + '</div>';
    var fig = safeUrl(T.figure);
    if (fig) html += '<figure><img src="' + attr(fig) + '" alt="' + attr(T.figureCaption || 'Teaching philosophy') + '">' + (T.figureCaption ? '<figcaption>' + esc(T.figureCaption) + '</figcaption>' : '') + '</figure>';
    if (DATA.teachingPhilosophy) html += '<div class="prose" style="margin-top:18px"><p>' + esc(DATA.teachingPhilosophy) + '</p></div>';
    html += '</section>';
    html += '<section class="section"><div class="section-head"><h2>Courses</h2></div><div class="courses">' + DATA.courses.map(function (c) { return '<div class="course"><div><div class="code">' + esc(c.code) + '</div><div class="term">' + esc(c.term) + (c.level ? ' · ' + esc(c.level) : '') + '</div></div><div><h3>' + esc(c.title) + '</h3><p>' + esc(c.text) + '</p></div></div>'; }).join('') + '</div></section>';
    return html + '</div>';
  }

  var newsState = { era: null, kind: 'all' };
  function newsEras() {
    var eras = {}; DATA.news.forEach(function (n) { var e = n.era === 'before' ? 'before' : (n.date || '').slice(0, 4); if (e) eras[e] = (eras[e] || 0) + 1; });
    var ys = Object.keys(eras).filter(function (k) { return k !== 'before'; }).sort(function (a, b) { return b - a; });
    if (eras.before) ys.push('before');
    return { list: ys, counts: eras };
  }
  function viewNews() {
    var er = newsEras(); if (!newsState.era || er.list.indexOf(newsState.era) < 0) newsState.era = er.list[0] || null;
    var items = sortByDateDesc(DATA.news.filter(function (n) { var e = n.era === 'before' ? 'before' : (n.date || '').slice(0, 4); return e === newsState.era; }));
    var kinds = {}; items.forEach(function (n) { kinds[n.kind || 'news'] = (kinds[n.kind || 'news'] || 0) + 1; });
    var shown = newsState.kind === 'all' ? items : items.filter(function (n) { return (n.kind || 'news') === newsState.kind; });
    var html = pageBand('news', 'News and Gallery') + '<div class="wrap">' +
      '<div class="tabs" role="tablist">' + er.list.map(function (e) { return '<button role="tab" data-era="' + attr(e) + '" aria-selected="' + (newsState.era === e) + '">' + (e === 'before' ? 'Before KAIST (2021–2025)' : esc(e)) + ' <span class="muted">' + er.counts[e] + '</span></button>'; }).join('') + '</div>' +
      '<div class="filters"><button data-nk="all" aria-pressed="' + (newsState.kind === 'all') + '">All</button>' + Object.keys(kinds).map(function (k) { return '<button data-nk="' + attr(k) + '" aria-pressed="' + (newsState.kind === k) + '">' + esc(kindLabel(k)) + ' ' + kinds[k] + '</button>'; }).join('') + '</div>';
    html += shown.length ? '<div class="news-list">' + shown.map(newsItem).join('') + '</div>' : '<div class="empty">Nothing here yet.</div>';
    return html + '</div>';
  }

  function viewJoin() {
    var C = DATA.culture, L = DATA.lab, ap = C.apply || {};
    var html = pageBand('join', 'Join Us') + '<div class="wrap">';
    if (C.lead) html += '<p class="lede">' + esc(C.lead) + '</p>';
    html += '<section class="section"><div class="section-head"><h2>Who we are looking for</h2></div><div class="values">' + (C.lookingFor || []).map(function (v) { return '<div class="value"><h3>' + esc(v.title) + '</h3><p>' + esc(v.text) + '</p></div>'; }).join('') + '</div>';
    if (C.discourage && C.discourage.length) html += '<div class="eyebrow" style="margin-top:30px">What we discourage</div><div class="dislist">' + C.discourage.map(function (d) { return '<span>' + esc(d) + '</span>'; }).join('') + '</div>';
    html += '</section>';
    html += '<section class="section"><div class="section-head"><h2>Open positions</h2></div><p class="prose">' + esc(C.positions || '') + '</p>' +
      (C.goalsKo && C.goalsKo.length ? '<p class="ko">연구 목표: ' + C.goalsKo.map(esc).join(' · ') + '</p>' : '') + '</section>';
    html += '<section class="section"><div class="section-head"><h2>How to apply</h2></div><p class="prose">Email Prof. Kil-Wan Ko. One message with the items below is enough; there is no separate application form.</p>' +
      '<div class="apply">' +
      '<div class="box"><h4>Email</h4><div class="copy-row"><span class="addr">' + esc(L.email) + '</span>' + copyBtn(L.email, 'Copy address') + '</div></div>' +
      '<div class="box"><h4>Subject line</h4><div class="v"><code>' + esc(ap.subject) + '</code></div><div class="copy-row">' + copyBtn(ap.subject, 'Copy subject') + '</div></div>' +
      '<div class="box"><h4>Contents</h4><div class="v">' + esc(ap.contents) + '</div></div>' +
      '<div class="box"><h4>Attachments</h4><div class="v">' + esc(ap.attachments) + '</div></div>' +
      '</div><p class="muted" style="margin-top:18px;font-size:14px">' + esc(L.meetings) + '</p></section>';
    return html + '</div>';
  }

  function renderFooter() {
    var L = DATA.lab;
    document.getElementById('footer').innerHTML =
      '<div><h4>' + esc(L.short) + ' · ' + esc(L.name) + '</h4><div>' + esc(L.department) + '<br>' + esc(L.university) + '<br>' + esc(L.address) + '</div>' +
      '<div class="small">' + esc(L.meetings) + '<br>© ' + new Date().getFullYear() + ' GEHL, KAIST.</div></div>' +
      '<div><h4>Contact</h4><ul><li><span class="mono">' + esc(L.email) + '</span></li><li>' + copyBtn(L.email, 'Copy email') + '</li>' + (L.mapUrl ? '<li><a href="' + attr(L.mapUrl) + '" target="_blank" rel="noopener">Map ↗</a></li>' : '') + '</ul></div>' +
      '';
  }

  // ---------- router ----------
  var VIEWS = { home: viewHome, research: viewResearch, people: viewPeople, publications: viewPublications, teaching: viewTeaching, news: viewNews, join: viewJoin, blossoms: viewBlossoms };
  var currentView = 'home';
  function routeFromHash() {
    var h = (location.hash || '#home').slice(1);
    if (/^person-/.test(h)) return { view: 'people', person: h.slice(7) };
    if (/^news-/.test(h)) return { view: 'news', news: h.slice(5) };
    return { view: VIEWS[h] ? h : 'home' };
  }
  function render(opts) {
    opts = opts || {};
    var r = routeFromHash(); currentView = r.view;
    var app = document.getElementById('app');
    app.innerHTML = VIEWS[currentView]();
    document.querySelectorAll('nav.main a').forEach(function (a) { if (a.dataset.nav === (currentView === 'blossoms' ? 'home' : currentView)) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    document.getElementById('main-nav').classList.remove('open');
    document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
    renderFooter();
    fitTitle(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
    if (r.person) openPerson(r.person); else if (!opts.keepModal) closeModal();
    if (r.news) { var t = document.getElementById('news-' + r.news); if (t) t.scrollIntoView({ block: 'start' }); }
    else if (!opts.keepScroll) window.scrollTo(0, 0);
    var q = document.getElementById('pub-q'); if (q && opts.focusSearch) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  window.addEventListener('hashchange', function () { render(); });

  // ---------- events (delegated) ----------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-person],[data-pf],[data-pt],[data-py],[data-era],[data-nk],[data-copy],[data-close],[data-news],#menu-btn');
    if (!t) { if (e.target.classList && e.target.classList.contains('modal')) closeModal(); return; }
    if (t.id === 'menu-btn') { var nav = document.getElementById('main-nav'); var open = nav.classList.toggle('open'); t.setAttribute('aria-expanded', String(open)); return; }
    if (t.dataset.person) { e.preventDefault(); openPerson(t.dataset.person); return; }
    if (t.hasAttribute('data-close')) { closeModal(); return; }
    if (t.dataset.pf) { peopleFilter = t.dataset.pf; render({ keepScroll: true }); return; }
    if (t.dataset.pt) { pubState.type = t.dataset.pt; pubState.year = 'all'; render({ keepScroll: true }); return; }
    if (t.dataset.py) { pubState.year = t.dataset.py; render({ keepScroll: true }); return; }
    if (t.dataset.era) { newsState.era = t.dataset.era; newsState.kind = 'all'; render({ keepScroll: true }); return; }
    if (t.dataset.nk) { newsState.kind = t.dataset.nk; render({ keepScroll: true }); return; }
    if (t.dataset.news) { e.preventDefault(); var id = t.dataset.news, n = DATA.news.filter(function (x) { return x.id === id; })[0]; if (n) { newsState.era = n.era === 'before' ? 'before' : (n.date || '').slice(0, 4); newsState.kind = 'all'; } location.hash = '#news-' + id; if (location.hash === '#news-' + id) render(); return; }
    if (t.dataset.copy != null) {
      var text = t.dataset.copy, done = function () { toast('Copied: ' + text); };
      try { navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); }); } catch (err) { fallbackCopy(text); done(); }
    }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'pub-q') { pubState.q = e.target.value; render({ keepScroll: true, focusSearch: true }); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (document.getElementById('person-modal')) closeModal(); } });
  function fallbackCopy(text) { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { } document.body.removeChild(ta); }
  var toastTimer;
  function toast(msg, ms) { var r = document.getElementById('toast-root'); r.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>'; clearTimeout(toastTimer); toastTimer = setTimeout(function () { r.innerHTML = ''; }, ms || 2600); }

  // Size every page title so the lab name would exactly fill the column on one line.
  function fitTitle() {
    var wrap = document.querySelector('.pband .wrap'); if (!wrap) return;
    var cs = getComputedStyle(wrap), box = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); if (!(box > 0)) return;
    var probe = document.createElement('span'); probe.textContent = DATA.lab.name || 'GEHL';
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-family:' + cs.fontFamily + ';font-weight:700;font-size:100px;letter-spacing:-.012em';
    document.body.appendChild(probe); var w = probe.getBoundingClientRect().width; document.body.removeChild(probe);
    if (!w) return;
    var size = Math.floor(100 * box / w * 100) / 100;
    document.documentElement.style.setProperty('--title-size', (size >= 26 ? size : 0) + 'px');
    document.documentElement.classList.toggle('title-fit', size >= 26);
  }
  var rT; window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(fitTitle, 100); });

  // ---------- boot ----------
  render();
  try { var msg = sessionStorage.getItem('gehl-toast'); if (msg) { sessionStorage.removeItem('gehl-toast'); toast(msg, 4000); } } catch (e) { }

  window.GEHL = { pageKeys: PAGE_KEYS, data: DATA, render: render, toast: toast, esc: esc, parseAuthors: parseAuthors, matchMembers: matchMembers, autoAlias: autoAlias, rebuildIndex: buildMemberIndex, groups: GROUPS, kinds: KINDS, avatarSrc: avatarSrc, fmtDate: fmtDate, safeUrl: safeUrl, personById: personById };
})();
</script>
